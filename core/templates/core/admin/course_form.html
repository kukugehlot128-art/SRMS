{% extends 'core/admin/base.html' %}

{% block title %}Update Course{% endblock %}

{% block content %}
<div class="page-title">
    <h2>Update Course: {{ course.code }}</h2>
    <a href="{% url 'core:manage_courses' %}" class="btn"
        style="background: #F3F4F6; color: var(--text-main); border: 1px solid #D1D5DB;">
        <i class="fas fa-arrow-left"></i> Back to Courses
    </a>
</div>

<div class="card" style="max-width: 800px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Course Name</label>
            <input type="text" name="name" class="form-control" required value="{{ course.name|default:'' }}">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Course Code</label>
                <input type="text" name="code" class="form-control" required value="{{ course.code|default:'' }}">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" class="form-control" required>
                    <option value="Science" {% if course.category == 'Science' %}selected{% endif %}>Science</option>
                    <option value="Commerce" {% if course.category == 'Commerce' %}selected{% endif %}>Commerce</option>
                    <option value="Arts" {% if course.category == 'Arts' %}selected{% endif %}>Arts</option>
                    <option value="Technology" {% if course.category == 'Technology' %}selected{% endif %}>Technology</option>
                    <option value="Management" {% if course.category == 'Management' %}selected{% endif %}>Management</option>
                    <option value="Other" {% if course.category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label>Duration</label>
                <input type="text" name="duration" class="form-control" required value="{{ course.duration|default:'' }}">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Total Semesters</label>
                <input type="number" name="total_semesters" class="form-control" required min="1" max="10" value="{{ course.total_semesters|default:6 }}">
            </div>
        </div>

        <div class="form-group">
            <label>Course Image (Optional)</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            {% if course.image %}
            <small style="color: var(--text-light); display: block; margin-top: 5px;">Current image: <a href="{{ course.image.url }}" target="_blank">View</a></small>
            {% endif %}
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="5">{{ course.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 15px;">
            <i class="fas fa-save"></i> Save Course
        </button>
    </form>
</div>
{% endblock %}
