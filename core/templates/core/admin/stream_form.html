{% extends 'core/admin/base.html' %}

{% block title %}Update Stream{% endblock %}

{% block content %}
<div class="page-title">
    <h2>Update Stream: {{ stream.name }}</h2>
    <a href="{% url 'core:manage_streams' %}" class="btn"
        style="background: #F3F4F6; color: var(--text-main); border: 1px solid #D1D5DB;">
        <i class="fas fa-arrow-left"></i> Back to Streams
    </a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Stream Name</label>
            <input type="text" name="name" class="form-control" required value="{{ stream.name|default:'' }}">
        </div>

        <div class="form-group">
            <label>Parent Course</label>
            <select name="course_id" class="form-control" required>
                <option value="">-- Select Course --</option>
                {% for course in courses %}
                <option value="{{ course.id }}" {% if stream.course.id == course.id %}selected{% endif %}>{{ course.name }} ({{ course.code }})</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 15px;">
            <i class="fas fa-save"></i> Save Stream
        </button>
    </form>
</div>
{% endblock %}
