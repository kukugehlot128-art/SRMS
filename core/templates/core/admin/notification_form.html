{% extends 'core/admin/base.html' %}

{% block title %}Update Announcement{% endblock %}

{% block content %}
<div class="page-title">
    <h2>Update Announcement</h2>
    <a href="{% url 'core:manage_notifications' %}" class="btn"
        style="background: #F3F4F6; color: var(--text-main); border: 1px solid #D1D5DB;">
        <i class="fas fa-arrow-left"></i> Back to Notifications
    </a>
</div>

<div class="card" style="max-width: 650px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Headline (Title)</label>
            <input type="text" name="title" class="form-control" required value="{{ notif.title }}">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Category</label>
                <select name="notif_type" class="form-control" required>
                    <option value="general" {% if notif.notif_type == 'general' %}selected{% endif %}>📢 General Info
                    </option>
                    <option value="exam" {% if notif.notif_type == 'exam' %}selected{% endif %}>📝 Exam Update</option>
                    <option value="result" {% if notif.notif_type == 'result' %}selected{% endif %}>🏆 Result Declaration
                    </option>
                    <option value="assignment" {% if notif.notif_type == 'assignment' %}selected{% endif %}>📋 Assignment
                        Alert</option>
                    <option value="event" {% if notif.notif_type == 'event' %}selected{% endif %}>🎉 Campus Event</option>
                </select>
            </div>
            <div class="form-group">
                <label>Target Audience</label>
                <select name="target_role" class="form-control" required>
                    <option value="all" {% if notif.target_role == 'all' %}selected{% endif %}>Everyone</option>
                    <option value="student" {% if notif.target_role == 'student' %}selected{% endif %}>Students Only
                    </option>
                    <option value="professor" {% if notif.target_role == 'professor' %}selected{% endif %}>Professors /
                        Faculty Only</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Message Content</label>
            <textarea name="message" class="form-control" rows="5" required>{{ notif.message }}</textarea>
        </div>

        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="is_active" name="is_active" {% if notif.is_active %}checked{% endif %}
                style="width: 18px; height: 18px; accent-color: var(--secondary);">
            <label for="is_active" style="cursor: pointer; font-weight: 500; color: var(--text-main);">Active (Visible
                to users)</label>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 20px;">
            <i class="fas fa-save"></i> Save Changes
        </button>
    </form>
</div>
{% endblock %}
