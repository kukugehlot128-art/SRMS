{% extends 'core/admin/base.html' %}

{% block title %}{% if is_update %}Update{% else %}Create{% endif %} Assignment{% endblock %}

{% block content %}
<div class="page-title">
    <h2>{% if is_update %}Update Assignment{% else %}Create New Assignment{% endif %}</h2>
    <a href="{% url 'core:manage_assignments' %}" class="btn"
        style="background: #F3F4F6; color: var(--text-main); border: 1px solid #D1D5DB;">
        <i class="fas fa-arrow-left"></i> Back to Assignments
    </a>
</div>

<div class="card" style="max-width: 700px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Assignment Title</label>
            <input type="text" name="title" class="form-control" required value="{{ assignment.title|default:'' }}"
                placeholder="e.g. Chapter 4 Practice Problems">
        </div>

        <div class="form-group">
            <label>Related Subject</label>
            <select name="subject_id" class="form-control" required>
                <option value="">-- Select Subject --</option>
                {% for subject in subjects %}
                <option value="{{ subject.id }}" {% if assignment.subject_id == subject.id %}selected{% endif %}>{{
                    subject.code }} - {{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" class="form-control" required
                    value="{{ assignment.due_date|date:'Y-m-d'|default:'' }}">
            </div>
            <div class="form-group">
                <label>Maximum Marks</label>
                <input type="number" name="max_marks" class="form-control" min="1" max="1000" required
                    value="{{ assignment.max_marks|default:'10' }}">
            </div>
        </div>

        <div class="form-group">
            <label>Instructions / Description</label>
            <textarea name="description" class="form-control" rows="6" required
                placeholder="Detailed instructions for the assignment...">{{ assignment.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 15px;">
            <i class="fas fa-save"></i> {% if is_update %}Save Changes{% else %}Create Assignment{% endif %}
        </button>
    </form>
</div>
{% endblock %}
