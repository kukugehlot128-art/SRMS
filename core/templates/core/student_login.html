{% extends 'core/base.html' %}
{% load static %}

{% block title %}Student Login - CodeCraft College{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px); padding: 2rem;">
    <div style="display: flex; max-width: 1000px; width: 100%; background: rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1); backdrop-filter: blur(10px);">
        
        <!-- Left Side: Login Form -->
        <div style="flex: 1; padding: 4rem; display: flex; flex-direction: column; justify-content: center;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <div style="background: rgba(245, 158, 11, 0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                    <i class="fas fa-user-graduate" style="font-size: 2.5rem; color: #f59e0b;"></i>
                </div>
                <h2 style="font-size: 2rem; font-weight: 700; color: #1f2937;">Student Portal</h2>
                <p style="color: #6b7280; margin-top: 0.5rem; font-size: 1.1rem;">View your results and schedule</p>
            </div>
            
            <form method="POST" action="{% url 'core:student_login' %}">
                {% csrf_token %}
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.5rem;">Enrollment No / Username</label>
                    <div style="position: relative;">
                        <i class="fas fa-id-card" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af;"></i>
                        <input type="text" name="username" required style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;" placeholder="Enter your ID" onfocus="this.style.borderColor='#f59e0b'; this.style.boxShadow='0 0 0 3px rgba(245, 158, 11, 0.2)'" onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'">
                    </div>
                </div>
                
                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 0.5rem;">Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af;"></i>
                        <input type="password" name="password" required style="width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;" placeholder="Enter password" onfocus="this.style.borderColor='#f59e0b'; this.style.boxShadow='0 0 0 3px rgba(245, 158, 11, 0.2)'" onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'">
                    </div>
                </div>
                
                <button type="submit" style="width: 100%; padding: 1rem; background-color: #f59e0b; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 15px -3px rgba(245, 158, 11, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px -1px rgba(245, 158, 11, 0.3)'">
                    Enter Dashboard <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
                </button>
            </form>
        </div>

        <!-- Right Side: Image -->
        <div style="flex: 1; background-image: url('{% static 'images/student_side.png' %}'); background-size: cover; background-position: center; position: relative; min-height: 400px; border-left: 1px solid #e5e7eb;">
            <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(0,0,0,0.5));"></div>
        </div>
        
    </div>
</div>
{% endblock %}
