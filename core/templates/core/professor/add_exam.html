{% extends 'core/professor/base.html' %}
{% block title %}Schedule Exam{% endblock %}
{% block page_title %}Schedule Exam{% endblock %}
{% block nav_exams %}active{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h2>Schedule Exam</h2>
        <p>Create a new exam for your students</p>
    </div>
    <a href="{% url 'core:professor_exams' %}" class="btn btn-outline">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card" style="max-width:700px">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group full">
                <label>Exam Name</label>
                <input type="text" name="name" placeholder="e.g. Unit Test 1 — Data Structures" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <select name="subject" required>
                    <option value="">-- Select Subject --</option>
                    {% for s in my_subjects %}
                    <option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Exam Type</label>
                <select name="exam_type">
                    {% for val, label in exam_types %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Total Marks</label>
                <input type="number" name="total_marks" value="100" min="1">
            </div>
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" name="start_time" required>
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="time" name="end_time" required>
            </div>
            <div class="form-group full">
                <label>Room / Hall (optional)</label>
                <input type="text" name="room" placeholder="e.g. Hall A, Room 203">
            </div>
        </div>
        <div style="margin-top:20px;display:flex;gap:12px">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Schedule Exam
            </button>
            <a href="{% url 'core:professor_exams' %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
