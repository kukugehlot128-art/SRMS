{% extends 'core/professor/base.html' %}

{% block title %}Mark Attendance{% endblock %}

{% block content %}
<div class="page-title">
    <h2>Daily Attendance Entry</h2>
</div>

<div class="card">
    <form method="POST" id="attendance-form">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom:0;">
                <label for="subject-select">Select Subject</label>
                <select name="subject_id" id="subject-select" class="form-control" required>
                    <option value="">-- Choose Subject --</option>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if subject.id|stringformat:"s" == selected_subject_id %}selected{% endif %}>{{ subject.name }} ({{ subject.code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label for="attendance-date">Date</label>
                <input type="date" name="date" id="attendance-date" class="form-control" required>
            </div>
        </div>

        <div id="student-list-container" style="margin-top: 20px;">
            <!-- Student list is loaded here via fetch() -->
            <div id="attendance-placeholder" style="text-align: center; padding: 40px; background: #F9FAFB; border-radius: 8px; border: 1px dashed #D1D5DB; color: var(--text-light);">
                <i class="fas fa-hand-pointer" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>
                <p>Please select a subject to load students.</p>
            </div>
        </div>
    </form>
</div>

<script>
    // Set today's date as default
    document.getElementById('attendance-date').valueAsDate = new Date();

    // Load students via fetch when subject changes
    document.getElementById('subject-select').addEventListener('change', function() {
        const subjectId = this.value;
        const container = document.getElementById('student-list-container');

        if (!subjectId) {
            container.innerHTML = `
                <div id="attendance-placeholder" style="text-align: center; padding: 40px; background: #F9FAFB; border-radius: 8px; border: 1px dashed #D1D5DB; color: var(--text-light);">
                    <i class="fas fa-hand-pointer" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>
                    <p>Please select a subject to load students.</p>
                </div>`;
            return;
        }

        // Show loading indicator
        container.innerHTML = `
            <div style="text-align:center; padding: 30px; color: var(--text-light);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom:10px; display:block;"></i>
                <p>Loading students...</p>
            </div>`;

        fetch(`/professor/attendance/${subjectId}/students/`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to load students');
                return response.text();
            })
            .then(html => {
                container.innerHTML = html;
            })
            .catch(error => {
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; background:#FEE2E2; border-radius:8px; color:#b91c1c;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 1.5rem; margin-bottom:8px; display:block;"></i>
                        <p>Error loading students. Please try again.</p>
                    </div>`;
            });
    });

    function markAll(status) {
        const radios = document.querySelectorAll(`input[type="radio"][value="${status}"]`);
        radios.forEach(radio => radio.checked = true);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const selectedSubjectId = "{{ selected_subject_id|default:'' }}";
        if (selectedSubjectId) {
            const select = document.getElementById('subject-select');
            select.value = selectedSubjectId;
            select.dispatchEvent(new Event('change'));
        }
    });
</script>
{% endblock %}
