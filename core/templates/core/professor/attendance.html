{% extends 'core/professor/base.html' %}

{% block title %}Mark Attendance{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div class="page-title" style="margin-bottom: 0;">
        <h2>Daily Attendance Entry</h2>
    </div>
    <a href="{% url 'core:professor_attendance_list' %}"
        style="background: #F59E0B; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: 500; text-decoration: none;">
        <i class="fas fa-list"></i> View Records
    </a>
</div>

<div class="card">
    <form method="POST" id="attendance-form">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #E5E7EB;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Attendance ID</label>
                <input type="text" class="form-control" value="[Auto Generated on Save]" disabled style="background: #F3F4F6;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Professor ID / Name</label>
                <input type="text" class="form-control" value="{{ request.user.get_full_name }} ({{ request.user.username }})" disabled style="background: #F3F4F6;">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Course Name *</label>
                <select id="course-select" class="form-control" required>
                    <option value="">-- Choose Course --</option>
                    {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.course_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Stream / Semester *</label>
                <select id="semester-select" class="form-control" required disabled>
                    <option value="">-- Choose Course First --</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Subject Name *</label>
                <select name="subject_id" id="subject-select" class="form-control" required disabled>
                    <option value="">-- Choose Semester First --</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom:0;">
                <label for="attendance-date">Date *</label>
                <input type="date" name="date" id="attendance-date" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Lecture / Period No. *</label>
                <input type="text" name="lecture_no" placeholder="e.g. 1st lecture" class="form-control" required>
            </div>
        </div>

        <div id="student-list-container" style="margin-top: 30px;">
            <!-- Student list is loaded here via fetch() -->
            <div id="attendance-placeholder" style="text-align: center; padding: 40px; background: #F9FAFB; border-radius: 8px; border: 1px dashed #D1D5DB; color: var(--text-light);">
                <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 15px; display:block; opacity: 0.3;"></i>
                <h3 style="color: var(--text-main); margin-bottom: 5px;">Student List</h3>
                <p>Please select a Course, Semester, and Subject to load students.</p>
            </div>
        </div>
    </form>
</div>

<script>
    // Set today's date as default
    document.getElementById('attendance-date').valueAsDate = new Date();

    const courseSelect = document.getElementById('course-select');
    const semesterSelect = document.getElementById('semester-select');
    const subjectSelect = document.getElementById('subject-select');
    const container = document.getElementById('student-list-container');

    function resetContainer() {
        container.innerHTML = `
            <div id="attendance-placeholder" style="text-align: center; padding: 40px; background: #F9FAFB; border-radius: 8px; border: 1px dashed #D1D5DB; color: var(--text-light);">
                <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 15px; display:block; opacity: 0.3;"></i>
                <h3 style="color: var(--text-main); margin-bottom: 5px;">Student List</h3>
                <p>Please select a Course, Semester, and Subject to load students.</p>
            </div>`;
    }

    courseSelect.addEventListener('change', function() {
        const courseId = this.value;
        semesterSelect.innerHTML = '<option value="">-- Choose Semester --</option>';
        subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
        subjectSelect.disabled = true;
        resetContainer();

        if (!courseId) {
            semesterSelect.disabled = true;
            return;
        }

        semesterSelect.disabled = false;
        fetch(`/professor/ajax/get-semesters/?course_id=${courseId}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(sem => {
                    semesterSelect.innerHTML += `<option value="${sem.id}">${sem.stream__stream_name} - ${sem.semester_name}</option>`;
                });
            });
    });

    semesterSelect.addEventListener('change', function() {
        const semesterId = this.value;
        subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
        resetContainer();

        if (!semesterId) {
            subjectSelect.disabled = true;
            return;
        }

        subjectSelect.disabled = false;
        fetch(`/professor/ajax/get-subjects/?semester_id=${semesterId}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(sub => {
                    subjectSelect.innerHTML += `<option value="${sub.id}">${sub.subject_name} (${sub.code})</option>`;
                });
            });
    });

    subjectSelect.addEventListener('change', function() {
        const subjectId = this.value;

        if (!subjectId) {
            resetContainer();
            return;
        }

        container.innerHTML = `
            <div style="text-align:center; padding: 40px; color: var(--text-light);">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; margin-bottom:15px; display:block; color: var(--primary);"></i>
                <p>Loading student list...</p>
            </div>`;

        fetch(`/professor/attendance/students/${subjectId}/`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to load students');
                return response.text();
            })
            .then(html => {
                container.innerHTML = html;
            })
            .catch(error => {
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; background:#FEE2E2; border-radius:8px; color:#b91c1c;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 1.5rem; margin-bottom:8px; display:block;"></i>
                        <p>Error loading students. Please try again.</p>
                    </div>`;
            });
    });

    function markAll(status) {
        const radios = document.querySelectorAll(`input[type="radio"][value="${status}"]`);
        radios.forEach(radio => radio.checked = true);
    }
</script>
{% endblock %}
