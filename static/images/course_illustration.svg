<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft pastel gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbfb" />
      <stop offset="100%" stop-color="#ebedee" />
    </linearGradient>
    <linearGradient id="shape-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8ec5fc" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  
  <!-- Subtle decorative ambient shapes -->
  <circle cx="150" cy="150" r="300" fill="url(#shape-grad1)" filter="blur(60px)" />
  <circle cx="650" cy="450" r="350" fill="#fbcfe8" fill-opacity="0.5" filter="blur(80px)" />
  <circle cx="700" cy="100" r="250" fill="#bae6fd" fill-opacity="0.5" filter="blur(70px)" />
  
  <!-- Central Glassmorphism UI Card -->
  <rect x="250" y="150" width="300" height="300" rx="40" fill="rgba(255,255,255,0.75)" stroke="rgba(255,255,255,0.9)" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Soft Inner Glow -->
  <circle cx="400" cy="300" r="120" fill="url(#glow)" />
  
  <!-- Minimalist Education Vector Illustration (Open Book + Graduation Sparkles) -->
  <g transform="translate(320, 230)" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book Pages -->
    <path d="M 20 100 L 80 120 L 140 100 V 30 L 80 50 L 20 30 Z" />
    <!-- Book Spine -->
    <path d="M 80 120 V 50" />
    <!-- Page Curves -->
    <path d="M 30 50 C 50 30, 70 30, 80 50" />
    <path d="M 130 50 C 110 30, 90 30, 80 50" />
    
    <!-- Floating Minimal Elements -->
    <circle cx="140" cy="20" r="6" fill="#f59e0b" stroke="none" />
    <circle cx="20" cy="10" r="4" fill="#10b981" stroke="none" />
    <path d="M 120 140 L 140 140" stroke="#8b5cf6" stroke-width="4" />
    <path d="M 30 135 L 50 135" stroke="#ec4899" stroke-width="4" />
  </g>
</svg>
